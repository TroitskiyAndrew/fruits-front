<ui-stack [formGroup]="form">
  <ui-input label="Имя" formControlName="name">
  </ui-input>
  <ui-input label="Контактная информация" formControlName="contact">
  </ui-input>

  <ui-toggler [options]="deliveryPlaceOptions" formControlName="placeType" [value]="form.controls.placeType.value"></ui-toggler>
  @if (isHotel) {
  <ui-input label="Отель" formControlName="place">
  </ui-input>
  <ui-input label="Комната" formControlName="placeAdd">
  </ui-input>
  }
  <ui-input label="Дата доставки" type="date" formControlName="date">
  </ui-input>
  @if (isHotel) {
  <ui-toggler [options]="deliveryTypeOptions" formControlName="deliveryType" [value]="form.controls.deliveryType.value"></ui-toggler>
  }

</ui-stack>
