<ui-stack>
  <ui-stack class="w-100">
    @for (product of products; track $index) {
      <product-card
        class="w-100"
        [isExpanded]="products.length === 1"
        [product]="product"
        [usage]="productCardUsage"
        [cartIndex]="$index"
        [_currency]="currency()"
        (changeContent)="changeContent($event, $index)"
        (deleteContent)="deleteContent($event)"
      />
    }
  </ui-stack>
  @let addons = orderAddons();
  @if(addons.length){
    <ui-stack>
        @for (addon of addons; track addon.id) {
          <addon-card [addon]="addon" (selectAddon)="selectAddon(addon.id)" [usage]="usage === OrderContentPlace.CartPage ? AddonCardPlace.Cart : AddonCardPlace.OrderPage"></addon-card>
        }
      </ui-stack>

  }
</ui-stack>
