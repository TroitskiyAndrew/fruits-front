  <ui-stack>
    <ui-toggler class="center-self" [options]="currencyOptions" [value]="currency()" (valueChange)="changeCurrency($event)"></ui-toggler>
    @let content = contentSignal();
    <div class="title">
      Общая сумма: {{content.total | priceString}} {{currencySymbol()}}
    </div>
    <ui-stack class="w-100">
      @for (product of content.products; track $index) {
      <product-card class="w-100" [isExpanded]="content.products.length === 1" [product]="product" [usage]="ProductCardPlace.Cart" [cartIndex]="$index" (changeContent)="changeContent($event, $index)" (deleteContent)="deleteContent($event)" />
      }
    </ui-stack>
    @if(content.products.length){
      <ui-toggler class="center-self" [options]="deliveryOptions" [value]="stateService.expressDelivery()" (valueChange)="changeDelivery()"></ui-toggler>
    }

  </ui-stack>
