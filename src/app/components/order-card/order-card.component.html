<ui-card>

  <ui-row>

    <div>
      Order
      <ui-badge>
        {{order.userId}}
      </ui-badge>
    </div>


  </ui-row>

  <div class="subtitle">

    {{order.content.products.length}}
    products

  </div>

  <ui-stack>
    @for (p of order.content.products; track $index) {
    <ui-row>

      <div>
        {{p.name}}
      </div>

      <div class="subtitle">
        x{{p.amount}}
      </div>

    </ui-row>

    }

  </ui-stack>

</ui-card>
