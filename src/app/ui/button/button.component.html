<button
  class="btn"
  [disabled]="disabled || loading"
  (click)="click()"
  [ngClass]="[
    'btn-' + variant,
    'size-' + size,
    icon ? 'icon' : ''
  ]"
>

  @if (loading) {

    <span class="loader"></span>

  } @else {

    <!-- icon left -->
    @if (fa && !iconRight) {
      <i [class]="fa"></i>
    }

    <!-- content -->
    <ng-content />

    <!-- icon right -->
    @if (fa && iconRight) {
      <i [class]="fa"></i>
    }

  }

</button>
