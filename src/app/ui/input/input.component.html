<div class="field">
  @if (label) {
    <label>{{ label }}</label>
  }

  <div class="input-wrapper">
    <input
      [type]="type"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [attr.min]="min"
      [attr.step]="step"
      (input)="change($any($event.target).value)"
      (blur)="onTouched()"
    />

    @if (clearable && value) {
      <button type="button" class="clear" (click)="clear()">×</button>
    }
  </div>
</div>
