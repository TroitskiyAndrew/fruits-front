<div class="ui-input">

  @if(icon) {

  <span class="icon">
    {{icon}}
  </span>
  }

  <input [type]="type" [placeholder]="placeholder" [value]="value" [disabled]="disabled" (input)="change($event)" />


  @if(clearable && value) {

  <button class="clear" (click)="clear()">
    ✕
  </button>
  }


  @if (suffix) {
  <span class="suffix">
    {{suffix}}
  </span>

  }

</div>
