<ui-page title="Платежи">

  <ui-input placeholder="From" [formControl]="fromFilter" />

  <ui-input placeholder="To" [formControl]="toFilter" />

  <ui-input placeholder="Currency" [formControl]="currencyFilter" />

  <ui-stack>
    @for (payment of payments; track $index) {
    <payment-card class="w-100" [payment]="payment" />

    }

  </ui-stack>
</ui-page>
