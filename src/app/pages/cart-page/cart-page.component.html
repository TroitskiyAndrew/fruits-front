<ui-page title="Корзина" [showCurrency]="true">

  @let orderContent = content();
  @let currentCurrency = currency();
  <order-content [_currency]="currentCurrency" [usage]="OrderContentPlace.CartPage" [content]="orderContent" (updateContent)="updateCart($event)" class="w-100"></order-content>
  <div class="title right">
    Выбранные наборы: {{cartTotal() | priceString : currentCurrency}} {{currencySymbol()}}
  </div>
  @if (showDelivery) {
    <placing-order [_currency]="currentCurrency" class="w-100"></placing-order>

  } @else {
    <ui-button link="placing-order" [disabled]="orderContent.products.length === 0">Оформить заказ</ui-button>
  }
</ui-page>
