<ui-page>
  <div class="title">
    Товары
  </div>

  @if (creating) {

  <product-card [compactView]="false" [usage]="ProductUsage.Editing" (cancel)="creating = false" (accept)="creating = false" />

  } @else {

  <ui-button (action)="creating = true">
    Новый продукт/набор
  </ui-button>
  <ui-input icon="🔍" placeholder="Поиск товара" [formControl]="searchControl" [clearable]="true" />

  <ui-stack>
    @for (item of products(); track $index) {
    <product-card [product]="item" [usage]="ProductUsage.Editing" />
    }
  </ui-stack>
  }


</ui-page>
