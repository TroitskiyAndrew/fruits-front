<ui-page>
  <div class="title">
    Products
  </div>

  <ui-button (action)="creating = true">
    Create product
  </ui-button>

  @if (creating) {

  <product-card (cancelEvent)="creating = false" (save)="creating = false" />

  }

  <ui-input icon="🔍" placeholder="Search product" [formControl]="searchControl" [clearable]="true" />

  <ui-stack>
    @for (item of products(); track $index) {
    <product-card [product]="item" />
    }
  </ui-stack>
</ui-page>
