<ui-page>
  <div class="title">
    Orders
  </div>

  <ui-input placeholder="User id" [formControl]="userFilter" />

  <ui-input placeholder="Min price" type="number" [formControl]="priceFilter" />

  <ui-stack>
    @for (order of orders; track $index) {
    <order-card [order]="order" />

    }

  </ui-stack>

</ui-page>
