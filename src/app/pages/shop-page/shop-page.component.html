<ui-page [showBack]="false" [showCurrency]="true">
  <ui-stack class="w-100">
    @for (set of sets(); track $index) {
      @if (selectedSet() == null || selectedSet() === set.id) {
        <product-card
          class="w-100"
          [product]="set"
          [usage]="ProductCardPlace.Shop"
          [_currency]="currency()"
          (accept)="cancelSelect()"
          (expand)="selectSet(set.id)"
          (cancel)="cancelSelect()"
        />
      }
    }
  </ui-stack>
</ui-page>
