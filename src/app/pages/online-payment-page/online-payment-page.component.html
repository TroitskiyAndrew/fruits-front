<ui-page>
  @let payment = paymentSignal();
  @if (payment) {
    <div class="title">
      Онлайн оплата
    </div>
        <ui-toggler class="center-self" [options]="currencyOptions" [value]="currency()"
      (valueChange)="changeCurrency($event)"></ui-toggler>
    <payment-card class="w-100" [payment]="payment" [usage]="PaymentCardPlace.OnlinePayment" (payed)="paid($event)"></payment-card>
  }

</ui-page>
