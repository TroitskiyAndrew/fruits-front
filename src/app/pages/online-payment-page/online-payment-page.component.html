<ui-page>
  <div class="title">
    Онлайн оплата
  </div>
  <ui-toggler class="center-self" [options]="currencyOptions" [value]="currency()" (valueChange)="changeCurrency($event)"></ui-toggler>
  <div class="title">
    Общая сумма: {{total() | priceString}} {{currencySymbol()}}
  </div>
  <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden #fileInput>
  <ui-button (action)="fileInput.click()">
    Мои заказы
  </ui-button>

</ui-page>
